name: Release

# Tag a version and the payload is built and published automatically, so
# fgg-playpods.elf is one click from the releases page and nobody has to
# install a cross-compiler to get it.
on:
  push:
    # Both spellings: 'v1.0' and a bare '1.0'.
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the payload to (e.g. 1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish payload
    runs-on: ubuntu-latest

    steps:
      # A manual run must check out the tag, not whatever is on main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make unzip curl

      - name: Install PS5 Payload SDK
        run: |
          curl -sSL -o sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o -d /opt sdk.zip
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      - name: Build
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make
          file fgg-playpods.elf

      # Payload Manager reads this alongside the ELF, so installing from a
      # release is a copy of two files into /data/pldmgr/payloads/fgg-playpods/.
      - name: Generate payload metadata
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          SHA=$(sha256sum fgg-playpods.elf | cut -d' ' -f1)
          cat > fgg-playpods.elf.json <<META
          {
            "name": "FGG-PlayPods",
            "filename": "fgg-playpods.elf",
            "description": "PS5 game and system audio on a Bluetooth headset",
            "version": "${VERSION}",
            "checksum": "${SHA}",
            "category": "Utilities",
            "source": "https://github.com/FGGstore/FGG-PlayPods"
          }
          META
          sha256sum fgg-playpods.elf | tee SHA256SUMS
          cat fgg-playpods.elf.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: FGG-PlayPods ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            fgg-playpods.elf
            fgg-playpods.elf.json
            SHA256SUMS
          body: |
            ## Install

            **Payload Manager** — copy `fgg-playpods.elf` and `fgg-playpods.elf.json`
            into `/data/pldmgr/payloads/fgg-playpods/` over FTP, then launch
            **fgg playpods**.

            **Direct** — send `fgg-playpods.elf` to port 9021 with any payload sender.

            ## Use

            The first time, put the headset in pairing mode before launching.
            After that, switch the headset on and launch: it reconnects by itself.
            Switch the headset off to stop.

            Verify your download against `SHA256SUMS`.
